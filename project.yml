name: MissingTable
options:
  bundleIdPrefix: com.missingtable
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  MTKit:
    path: MTKit
targets:
  MissingTable:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: MTKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Missing Table
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.missingtable
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/MissingTable.entitlements
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # Release is only archived by .github/workflows/testflight.yml, which installs
        # this certificate and profile. Manual signing because automatic signing archives
        # with a development profile, and Apple issues none to a team with no devices.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: mt-ios AppStore
          CODE_SIGN_ENTITLEMENTS: App/MissingTable-Release.entitlements
  MissingTableTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: MissingTable
schemes:
  MissingTable:
    build:
      targets:
        MissingTable: all
    test:
      targets:
        - MissingTableTests
        - package: MTKit/MTKitTests
