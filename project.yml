name: MissingTable
options:
  bundleIdPrefix: io.silverbeer
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  MTKit:
    path: MTKit
targets:
  MissingTable:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: MTKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Missing Table
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.silverbeer.mt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  MissingTableTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: MissingTable
schemes:
  MissingTable:
    build:
      targets:
        MissingTable: all
    test:
      targets:
        - MissingTableTests
        - package: MTKit/MTKitTests
